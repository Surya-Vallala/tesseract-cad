name: android
# Builds the Tesseract CAD APK with the official Android SDK on GitHub's machines.
# The release APK comes out unsigned (it is signed with the release key outside GitHub, since this repo is public);
# a debuggable test copy, signed with a throwaway key, is installed on an emulator and driven through DevTools.
on:
  push:
    branches: [apk-ci]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          set -o pipefail
          bash ci/build.sh 2>&1 | tee out-build.log
      - name: Publish a test update channel (branch apk-channel) for the emulator test
        run: |
          mkdir -p channel && cp out/test-update.apk channel/
          VNAME=$(sed -n 1p version.txt); VCODE=$(sed -n 2p version.txt)
          SIZE=$(stat -c %s channel/test-update.apk); SHA=$(sha256sum channel/test-update.apk | cut -d' ' -f1)
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/apk-channel"
          printf '{"name":"%s-ci","code":%d,"date":"2026-10-14","notes":["Emulator test update"],"apk":{"url":"%s/test-update.apk","size":%d,"sha256":"%s"}}' "$VNAME" $((VCODE + 1)) "$RAW" "$SIZE" "$SHA" > channel/version.json
          cat channel/version.json
          cd channel && git init -q -b apk-channel && git config user.name apk-ci && git config user.email apk-ci@users.noreply.github.com
          git add -A && git commit -q -m "test channel $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-channel
      - name: Check the published release on the website
        run: bash ci/live-check.sh
      - name: Check the signed release APK
        if: hashFiles('signed/*.apk') != ''
        run: bash ci/verify.sh
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/emutest.sh
      - name: Publish results to branch apk-out
        if: always()
        run: |
          mkdir -p out; cp out-build.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/source-commit.txt
          cd out
          git init -q -b apk-out
          git config user.name "apk-ci"; git config user.email "apk-ci@users.noreply.github.com"
          git add -A; git commit -q -m "results for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-out
